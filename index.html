<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; manifest-src 'self'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#050607">
<title>מטרונום החייאה</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#050607; --fg:#f5f6f7; --dim:#9aa0a6; --panel:#101215; --line:#23262b;
    --dot-empty:#26282c; --dot-fill:#ffffff; --amber:#ff9f2e;
    --green:#22c55e; --cyan:#38bdf8; --red:#d81f2f; --red-press:#a8121f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
    display:flex; flex-direction:column; align-items:center;
    padding:8px 12px 6px; gap:8px; overflow-x:hidden;
  }
  :focus-visible{outline:2px solid #7dd3fc; outline-offset:2px;}
  header{text-align:center; line-height:1.15;}
  header h1{margin:0; font-size:19px; font-weight:700;}
  #sub{color:var(--dim); font-size:13px; margin-top:2px;}
  #clock{
    font-size:26px; font-weight:800; margin-top:2px;
    font-variant-numeric:tabular-nums; direction:ltr;
  }
  #clock.frozen{color:var(--amber);}

  /* ring */
  #ringWrap{position:relative; width:min(84vw,300px); aspect-ratio:1;}
  #ringWrap svg{width:100%; height:100%; display:block;}
  .dot{fill:var(--dot-empty); transition:fill .08s linear;}
  .dot.f{fill:var(--dot-fill);}
  .dot.f.last{fill:var(--amber);}
  .dot.g{fill:var(--green);}
  .dot.c{fill:var(--cyan);}
  #ventDots{display:none;}
  #ringWrap.vent #dots{display:none;}
  #ringWrap.vent #ventDots{display:inline;}
  #center{
    position:absolute; inset:0; display:flex; flex-direction:column-reverse;
    align-items:center; justify-content:center; pointer-events:none;
  }
  #num{
    font-size:82px; font-weight:800; line-height:1;
    font-variant-numeric:tabular-nums; direction:ltr;
  }
  #num.green{color:var(--green);} #num.cyan{color:var(--cyan);} #num.amber{color:var(--amber);}
  #stateLab{
    margin-bottom:4px; font-size:18px; font-weight:700; line-height:1.15; max-width:200px;
    min-height:18px; text-align:center;
  }
  #stateLab.green{color:var(--green);} #stateLab.cyan{color:var(--cyan);} #stateLab.amber{color:var(--amber);}

  /* buttons */
  #btns{width:100%; max-width:420px; display:flex; flex-direction:column; gap:8px;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:14px;}
  #primaryRow{display:flex; gap:8px;}
  .mainBtn{
    flex:1 1 0; height:64px; font-size:22px; font-weight:800;
    color:#fff; background:var(--red);
  }
  .mainBtn:active{background:var(--red-press);}
  #startBtn{background:var(--red);}
  #pauseBtn{background:#8a6a16;}
  #resumeBtn{background:#1d7f3f;}
  #stopBtn{background:var(--red-press);}
  #resetBtn{
    height:58px; font-size:16px; font-weight:700;
    color:var(--fg); background:var(--panel); border:1px solid var(--line);
  }
  #resetBtn:active{background:#1b1e23;}
  #resetBtn:disabled{opacity:.35; pointer-events:none;}
  #resetBtn.hide{visibility:hidden;}

  /* settings panel */
  #panel{
    width:100%; max-width:420px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:8px 12px;
    display:flex; flex-direction:column; gap:4px;
  }
  .row{display:flex; align-items:center; gap:10px; min-height:42px;}
  .row .lab{font-size:14px; flex:0 0 84px; line-height:1.2;}
  .row output{font-size:13px; color:var(--dim); min-width:72px; text-align:start;
    font-variant-numeric:tabular-nums;}
  .row.off{opacity:.35;}
  .row.locked{opacity:.45; pointer-events:none;}
  .seg{display:flex; margin-inline-start:auto; border:1px solid var(--line); border-radius:10px; overflow:hidden; flex:1 1 auto; max-width:280px;}
  .seg button{
    border-radius:0; background:transparent; color:var(--dim);
    padding:0 6px; height:46px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px; flex:1 1 0;
  }
  .seg button span{font-size:10.5px; font-weight:700; white-space:nowrap;}
  #patientRow .seg button span, #rescuersRow .seg button span{font-size:15px;}
  #mode1 svg, #mode2 .icon-row svg:nth-child(1){fill:#ff4d4d;}
  #mode2 .icon-row svg:nth-child(3), #mode3 svg{fill:#4aa3ff;}
  .seg button .icon-row{display:flex; align-items:center; justify-content:space-between; width:100%;}
  #mode2{display:grid; grid-template-columns:max-content; justify-content:center; justify-items:stretch; align-content:center; row-gap:2px;}
  #mode2 span:last-child{text-align:center;}
  .seg button.on{background:#2a2e35; color:var(--fg);}
  input[type=range]{
    direction:ltr; flex:1; min-width:60px; height:32px; accent-color:#e879f9; margin:0;
  }
  input[type=range]:disabled{opacity:.35;}

  footer{
    color:#6a7076; font-size:11px; text-align:center; line-height:1.35;
    max-width:420px; margin-top:auto;
  }
  #credit{
    color:#6a7076; font-size:11px; text-align:center; width:100%; max-width:420px;
  }

  /* short screens — compact layout; the footer stays visible, the reset button keeps its size */
  @media (max-height:890px){
    body{gap:4px; padding-top:4px; padding-bottom:3px;}
    header h1{font-size:16px;} #sub{font-size:12px; margin-top:1px;} #clock{font-size:20px; margin-top:0;}
    #ringWrap{width:min(60vw,200px);}
    #num{font-size:54px;} #stateLab{font-size:14px; min-height:16px; max-width:150px; margin-bottom:2px;}
    #btns{gap:5px;}
    .mainBtn{height:48px; font-size:18px;}
    #resetBtn{height:46px; font-size:14px;}
    #panel{padding:4px 10px; gap:1px;}
    .row{min-height:32px;}
    .seg button{height:38px;}
    .row input[type=range]{height:28px;}
    footer{font-size:10px; line-height:1.25;}
    #credit{font-size:10px;}
  }
  @media (max-height:680px){
    #ringWrap{width:min(52vw,170px);}
    #num{font-size:46px;}
    header h1{font-size:15px;}
    .seg button{height:34px;}
    .row{min-height:30px;}
  }
</style>
</head>
<body>
<header>
  <h1>מטרונום החייאה</h1>
  <div id="sub">110 לדקה · 30:2</div>
  <div id="clock">0:00</div>
</header>

<div id="ringWrap">
  <svg viewBox="0 0 200 200" aria-hidden="true"><g id="dots"></g><g id="ventDots"></g></svg>
  <div id="center">
    <div id="num">1</div>
    <div id="stateLab"></div>
  </div>
</div>

<div id="btns">
  <div id="primaryRow">
    <button id="startBtn" class="mainBtn">התחל</button>
    <button id="pauseBtn" class="mainBtn" style="display:none">השהה</button>
    <button id="resumeBtn" class="mainBtn" style="display:none">המשך</button>
    <button id="stopBtn" class="mainBtn" style="display:none">עצור</button>
  </div>
  <button id="resetBtn" class="hide">אפס ספירה ל־1</button>
</div>

<div id="panel">
  <div class="row" id="patientRow">
    <span class="lab">מטופל</span>
    <div class="seg" role="group" aria-label="קבוצת גיל של המטופל">
      <button id="patientAdult" class="on" aria-pressed="true"><span>מבוגר</span></button>
      <button id="patientKid" aria-pressed="false"><span>ילד</span></button>
    </div>
  </div>
  <div class="row" id="rescuersRow">
    <span class="lab">מצילים</span>
    <div class="seg" role="group" aria-label="מספר המצילים (צוות מאפשר הפסקות החלפה; צוות בילד עובד ב־15:2)">
      <button id="rescuersSolo" aria-pressed="false"><span>יחיד (30:2)</span></button>
      <button id="rescuersTeam" class="on" aria-pressed="true"><span>צוות (30:2)</span></button>
    </div>
  </div>
  <div class="row">
    <span class="lab">מצב</span>
    <div class="seg" role="group" aria-label="מצב החייאה">
      <button id="mode1" aria-pressed="false" aria-label="עיסויים בלבד, ללא דופק"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span>עיסויים</span></button>
      <button id="mode2" class="on" aria-pressed="true" aria-label="החייאה מלאה, עיסויים והנשמות, ללא דופק"><span class="icon-row"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><svg width="12" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 3h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg><svg width="15" height="15" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path d="M 40 2 Q 42 8 45 11 L 45 34 L 55 34 L 55 11 Q 58 8 60 2 Q 50 6 40 2 Z"/><path d="M 38 36 C 34 30 26 28 20 32 C 10 38 6 50 5 62 C 4 74 6 84 10 90 C 14 95 20 96 26 94 C 30 93 33 96 37 93 C 41 90 42 84 41 76 C 40 66 42 58 40 50 C 39 44 40 40 38 36 Z"/><path d="M 62 36 C 66 30 74 28 80 32 C 90 38 94 50 95 62 C 96 74 94 84 90 90 C 86 95 80 96 74 94 C 70 93 67 96 63 93 C 59 90 58 84 59 76 C 60 66 58 58 60 50 C 61 44 60 40 62 36 Z"/></svg></span><span>החייאה מלאה</span></button>
      <button id="mode3" aria-pressed="false" aria-label="יש דופק, הנשמות בלבד"><svg width="16" height="16" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path d="M 40 2 Q 42 8 45 11 L 45 34 L 55 34 L 55 11 Q 58 8 60 2 Q 50 6 40 2 Z"/><path d="M 38 36 C 34 30 26 28 20 32 C 10 38 6 50 5 62 C 4 74 6 84 10 90 C 14 95 20 96 26 94 C 30 93 33 96 37 93 C 41 90 42 84 41 76 C 40 66 42 58 40 50 C 39 44 40 40 38 36 Z"/><path d="M 62 36 C 66 30 74 28 80 32 C 90 38 94 50 95 62 C 96 74 94 84 90 90 C 86 95 80 96 74 94 C 70 93 67 96 63 93 C 59 90 58 84 59 76 C 60 66 58 58 60 50 C 61 44 60 40 62 36 Z"/></svg><span>הנשמות</span></button>
    </div>
  </div>
  <div class="row" id="rateRow">
    <span class="lab">קצב עיסויים</span>
    <input type="range" id="rateLen" min="100" max="120" step="5" value="110" aria-label="קצב עיסויים, פעימות לדקה">
    <output id="rateOut">110 לדקה</output>
  </div>
  <div class="row" id="breathRow">
    <span class="lab">הנשמה</span>
    <input type="range" id="breathLen" min="1.5" max="4" step="0.5" value="2" aria-label="משך הפסקת ההנשמה, בשניות">
    <output id="breathOut">2 שנ׳</output>
  </div>
  <div class="row" id="swapRow">
    <span class="lab">החלפה<br><small style="color:var(--dim)">כל 2 דקות</small></span>
    <input type="range" id="swapLen" min="5" max="15" step="1" value="10" aria-label="משך הפסקת ההחלפה, בשניות">
    <output id="swapOut">10 שנ׳</output>
  </div>
</div>
<div id="credit">להצעות והערות: <bdi dir="ltr">tal.seifan+MDA@mail.huji.ac.il</bdi></div>

<footer>כלי עזר בלבד — יש להתקשר למד"א (101) ולפעול בהתאם להנחיות המוקד.</footer>

/* ================= constants =============================================== */
let BEAT = 60 / 110;              // compression interval (s); derived from rate slider, default 110 BPM
const SOLO_CYCLE = 30;             // compressions-only ring length — fixed, unaffected by patient/rescuer count
let TEAM_CYCLE = 30;               // full-CPR compressions-per-cycle before a breath pause: 30:2 (adult, or kid solo); 15:2 (kid, team)
const AHEAD = 0.12;               // schedule-ahead window (s)
const TICK_MS = 25;               // scheduler interval
const SWAP_EVERY = 120;          // s: swap deadline after last swap-pause end
const SWAP_CAP = 180;            // s: hard cap — forced swap pause
const BREATH_CAP = 30;            // s: hard cap — forced breathing pause (team)
let RUN_START = 25;               // dirty-while-pending: next beat jumps here — always TEAM_CYCLE - 5
/* pulse mode: count N seconds, then a breath (slider, 0.5-2 s). Adult: N=5 (breath 0.5/1 s) or 4 (1.5/2 s);
   kid: N=3. N is latched at the start of each cycle, so slider changes apply from the next cycle. */
function ventCountNow(){ return patient === "kid" ? 3 : (+breathLen.value >= 1.5 ? 4 : 5); }
function ventSubText(){
  const y = ventCountNow() + +breathLen.value;
  return Math.round(60 / y) + " נשימות לדקה";
}
let ventLen = 5, ventBreath = 1;   // latched count seconds / breath seconds for the current cycle
const SOLO_WARN_COUNT = 10;        // compressions-only: length of the spoken swap countdown
const VOICE_GAIN = 0.8;

const NUM_WORDS = {5:"five", 4:"four", 3:"three", 2:"two", 1:"one"};

    const a = (-90 + i * (360 / n)) * Math.PI / 180;
    const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx", (100 + 90 * Math.cos(a)).toFixed(2));
    c.setAttribute("cy", (100 + 90 * Math.sin(a)).toFixed(2));
    c.setAttribute("r", r);
    c.setAttribute("class", "dot");
    g.appendChild(c); arr.push(c);
  }
}
const buildRing = n => buildDots("dots", dotEls, n, "5.2");
const buildVentRing = n => buildDots("ventDots", ventDotEls, n, "9");
buildRing(ringCycleFor(mode));
buildVentRing(5);

/* ================= audio helpers =========================================== */
function b64ToBuf(b64){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}
async function decodeAll(){
  for(const n of Object.keys(VOICE_DATA)){
    buffers[n] = await new Promise((res, rej) =>
      ctx.decodeAudioData(b64ToBuf(VOICE_DATA[n]), res, rej));
  }
  buffersReady = true;
}
function track(node, t){ scheduled.push({node, t}); }

function tickSnd(t){ /* high tick */
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "square"; o.frequency.value = 1650;
  g.gain.setValueAtTime(0.55, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
  o.connect(g).connect(ctx.destination);
  o.start(t); o.stop(t + 0.05); track(o, t);
}
function lowClick(t){ /* quiet click under voice counts */
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine"; o.frequency.value = 440;
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  o.connect(g).connect(ctx.destination);
  o.start(t); o.stop(t + 0.05); track(o, t);
}
function swapBeep(t){ /* distinct tone kept ticking through the compressions-only swap pause */
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "triangle"; o.frequency.value = 900;
  g.gain.setValueAtTime(0.4, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  o.connect(g).connect(ctx.destination);
  o.start(t); o.stop(t + 0.1); track(o, t);
}
function playVoice(name, t){
  const b = buffers[name]; if(!b) return;
  const s = ctx.createBufferSource();
  s.buffer = b; s.connect(voiceGain);
  s.start(t); track(s, t);
}
function voicedBeat(word, t){ playVoice(word, t); lowClick(t); }

/* ================= timing helpers ========================================== */
function resetCycle(){ beat = 1; dirty = false; ranJump = false; forced = null; upcomingSwap = null; }
function silenceAll(){ for(const s of scheduled){ try{ s.node.stop(0); }catch(e){} } scheduled = []; visualQ = []; }
/* swaps exist only with TEAM rescuers and outside breaths-only mode (mode 3) */
function swapActive(){ return rescuers === "team" && mode !== 3; }
/* team Full CPR: is the pause at the end of the cycle that ends at `end` a swap? (one rule, used by both
   the pre-warning and the latch, so they always agree) */
function teamSwapNext(end){
  return (forced === "swap" && swapActive()) || isPending(end) ||
         (swapActive() && swapDeadline <= end + (+breathLen.value) + TEAM_CYCLE * BEAT);
}
let cycleSwap = false, cycleSwapFor = -1;   /* this cycle's swap decision; cycleSwapFor = lastPauseEnd it was made for */
function isPending(t){ return swapActive() && t >= swapDeadline - 1e-6; }
function syncSwapRow(){
  const on = swapActive();
  swapRow.classList.toggle("off", !on);
  swapLen.disabled = !on;
}
/* a swap clock starts fresh when it is (re)armed live, e.g. a team joins mid-session */
function armSwapTimers(){
  if(!running && !paused) return;
  const now = ctx.currentTime;
  swapDeadline = now + SWAP_EVERY; swapCapAt = now + SWAP_CAP;
}
function lockedAt(t){ return beat >= RUN_START + 1 && (isPending(t) || forced !== null); }
function nextSlot(from){ /* next grid slot >= from; nextTime is always on-grid */
  const k = Math.ceil((from - nextTime) / BEAT);
  return nextTime + Math.max(k, 0) * BEAT;
}
function armAfterPause(isSwap, end){
  lastPauseEnd = end;
  breathCapAt = end + BREATH_CAP;
  if(isSwap){ swapDeadline = end + SWAP_EVERY; swapCapAt = end + SWAP_CAP; }
}

/* ================= pauses ================================================== */
function enterBreath(t){
  const len = +breathLen.value;
  phase = "pause"; pauseKind = "breath";
  phaseEnd = t + len; nextTime = phaseEnd;
  resetCycle();
  armAfterPause(false, phaseEnd);
  playVoice("resp", t);
  visualQ.push({t, kind:"pause", pauseKind:"breath", end:phaseEnd});
}
function enterSwapPause(t){
  const len = +swapLen.value;
  phase = "pause"; pauseKind = "swr";
  phaseEnd = t + len; nextTime = t + BEAT;     /* the distinct swap tone keeps ticking through this pause */
  resetCycle();
  armAfterPause(true, phaseEnd);
  playVoice("swr", t);
  visualQ.push({t, kind:"pause", pauseKind, end:phaseEnd});
}
function enterSoloSwapPause(t){
  /* compressions-only mode: no breaths, just a pause so rescuers can switch —
     a distinct beep keeps ticking through the pause (see "swapPause" phase below) */
  const len = +swapLen.value;
  phase = "swapPause"; pauseKind = "swap";
  phaseEnd = t + len; nextTime = t + BEAT;
  resetCycle(); soloInv = false;
  swapDeadline = phaseEnd + SWAP_EVERY;
  playVoice("swap", t);
  visualQ.push({t, kind:"pause", pauseKind:"swap", end:phaseEnd});
}
function enterVent(t){
  /* pulse present, not breathing: after each dot-count, one rescue breath
     (ventBreath s, latched from the slider) is given — the breath itself isn't counted in dots */
  const len = ventBreath;
  phase = "pause"; pauseKind = "vent";
  phaseEnd = t + len; nextTime = phaseEnd;
  playVoice("resp", t);
  visualQ.push({t, kind:"pause", pauseKind, end:phaseEnd, inv:ventInv, tot:ventLen});
}

/* ================= scheduler =============================================== */
function schedulerTick(){
  const horizon = ctx.currentTime + AHEAD;
  let guard = 0;
  while(nextTime < horizon && guard++ < 80){
    if(phase === "swapPause"){
      if(nextTime >= phaseEnd - 1e-6){
        phase = "beats"; resetCycle();
        continue;                          /* compressions resume right at phaseEnd */
      }
      swapBeep(nextTime);                  /* keep a distinct beat going through the pause */
      nextTime += BEAT;
      continue;
    }
    if(phase === "pause"){
      if(pauseKind === "swr" && nextTime < phaseEnd - 1e-6){
        swapBeep(nextTime);                  /* swap + respiration pause: distinct tone, not the count */
        nextTime += BEAT;
        continue;
      }
      phase = "beats"; resetCycle();
      if(mode === 3){ ventBeat = 0; ventInv = !ventInv; }  /* alternate dot color each full cycle */
      if(mode === 2 && dotEls.length !== TEAM_CYCLE) buildRing(TEAM_CYCLE);  /* Rescuers may have changed mid-pause */
      continue;                            /* beats resume at nextTime = phaseEnd */
    }
    const t = nextTime;
    if(mode === 1){
      /* ---- compressions-only: continuous, ring alternates filling white / gray ----
         a swap pause is inserted every SWAP_EVERY seconds so rescuers can switch;
         the last SOLO_WARN_COUNT compressions are counted down aloud, one lead-in
         beat ("החלפה בעוד") ahead of that, with the dots turning amber to match */
      const swapOn = swapActive();
      if(swapOn && t >= swapDeadline - 1e-6){
        enterSoloSwapPause(t);
        continue;
      }
      const beatsLeft = swapOn ? Math.ceil((swapDeadline - t) / BEAT - 1e-6) : 0;
      let warn = false, cnt = null;
      if(beatsLeft === SOLO_WARN_COUNT + 1){
        warn = true;
        playVoice("swapin", t);
        tickSnd(t);
      } else if(beatsLeft >= 1 && beatsLeft <= SOLO_WARN_COUNT){
        warn = true; cnt = beatsLeft;
        voicedBeat(SOLO_SWAP_WORDS[beatsLeft], t);
      } else {
        tickSnd(t);
      }
      visualQ.push({t, kind:"beat", m:1, beat, inv:soloInv, warn, cnt});
      nextTime += BEAT; beat++;
      if(beat > SOLO_CYCLE){ beat = 1; soloInv = !soloInv; }
    } else if(mode === 3){
      /* ---- pulse present: no compressions; count ventLen s, then a rescue breath ---- */
      if(ventBeat === 0){ ventLen = ventCountNow(); ventBreath = +breathLen.value; }
      if(ventBeat < ventLen){
        visualQ.push({t, kind:"ventWait", n: ventBeat + 1, inv: ventInv, tot: ventLen});
        nextTime += 1; ventBeat++;
      } else {
        enterVent(t);
        continue;
      }
    } else {
      /* ---- team ---- */
      /* TEAM_CYCLE/RUN_START are live: a Rescuers (Solo/Team) change updates them immediately,
         and setRescuers() reconciles the in-flight beat count against them right away (see
         below) — so this loop can always just read the current values with no staleness. */
      if(beat <= RUN_START){
        if(swapActive() && t >= swapCapAt - 2.6){ beat = RUN_START + 1; forced = "swap"; }
        else if(t >= breathCapAt - 2.6){ beat = RUN_START + 1; forced = "breath"; }
        else if(isPending(t) && dirty && !ranJump){ beat = RUN_START; ranJump = true; }
      }
      /* decide once per cycle, at its 10th-from-last compression, whether it ends in a swap pause.
         A swap cycle announces "החלפה בעוד" one compression ahead, then counts ten…one aloud;
         a breath cycle counts only the last five (five…one). */
      if(beat >= TEAM_CYCLE - 10 && cycleSwapFor !== lastPauseEnd){
        cycleSwap = teamSwapNext(t + (TEAM_CYCLE + 1 - beat) * BEAT);
        cycleSwapFor = lastPauseEnd;
        if(cycleSwap) playVoice("swapin", t);
      }
      let cnt = beat, lab = "", warn = false;
      const countTen = cycleSwap && beat >= TEAM_CYCLE - 9;
      if(beat >= RUN_START + 1 || countTen){
        if(upcomingSwap === null) upcomingSwap = cycleSwap;   /* latch the coming pause type once */
        cnt = TEAM_CYCLE + 1 - beat;
        lab = upcomingSwap ? "swr" : "b";
        warn = true;
        voicedBeat((countTen ? SOLO_SWAP_WORDS : NUM_WORDS)[cnt], t);
      } else if(cycleSwap && beat === TEAM_CYCLE - 10){
        warn = true; lab = "swr";   /* "החלפה בעוד" lead-in beat */
        tickSnd(t);
      } else tickSnd(t);
      visualQ.push({t, kind:"beat", m:2, beat, cnt, lab, warn});
      nextTime += BEAT; beat++;
      if(beat > TEAM_CYCLE){
        beat = 1;
        const end = nextTime;
        if(upcomingSwap) enterSwapPause(end);
        else enterBreath(end);
      }
    }
  }
  if(scheduled.length > 300){
    const cut = ctx.currentTime - 4;
    scheduled = scheduled.filter(s => s.t > cut);
  }
}

function cancelFuture(){
  const now = ctx.currentTime;
  for(const s of scheduled){
    if(s.t > now - 2.5){ try{ s.node.stop(0); }catch(e){} }
  }
  scheduled = scheduled.filter(s => s.t <= now);
  const fut = visualQ.filter(e => e.t > now + 0.015);
  visualQ = visualQ.filter(e => e.t <= now + 0.015);
  fut.sort((a, b) => a.t - b.t);
  return fut[0] || null;
}

/* ================= reset button (dual role) ================================ */
function resetCount(){
  if(!running || mode === 1 || mode === 3 || phase === "pause") return;
  const t = ctx.currentTime;
  if(lockedAt(t)) return;                       /* locked final five before a swap/cap: untouchable */
  const ev = cancelFuture();
  dirty = true; upcomingSwap = null; cycleSwapFor = -1;
  if(dotEls.length !== TEAM_CYCLE) buildRing(TEAM_CYCLE);   /* adopt the currently selected ratio */
  if(isPending(t)){ beat = RUN_START; ranJump = true; }
  else beat = 1;
  nextTime = ev ? ev.t : nextSlot(t + 0.15);
  schedulerTick();
  disp = {phase:"idle", end:0, pauseKind:""};
}
resetBtn.addEventListener("click", () => {
  if(running) resetCount(); else if(!paused) frozenMs = 0;
});

/* ================= mode switch ============================================= */
const ringWrap = $("ringWrap");
let teamBreathLen = 2;    // remembered TEAM respiration-pause length (1.5-4s, default 2s)
let pulseBreathLen = 1;   // remembered PULSE breath-giving length (0.5-2s, default 1s)
function setMode(m){
  if(m === mode) return;
  if(mode === 2) teamBreathLen = +breathLen.value;       /* remember what we're leaving */
  else if(mode === 3) pulseBreathLen = +breathLen.value;
  mode = m;
  setOn(mode1Btn, m === 1); setOn(mode2Btn, m === 2); setOn(mode3Btn, m === 3);
  ringWrap.classList.toggle("vent", m === 3);
  if(m !== 3 && swapDeadline === Infinity && rescuers === "team") armSwapTimers();   /* leaving breaths-only */
  if(dotEls.length !== ringCycleFor(m)) buildRing(ringCycleFor(m));
  rateRow.classList.toggle("off", m === 3);        /* rate only applies to compressions (SOLO/TEAM) */
  rateLen.disabled = (m === 3);
  breathRow.classList.toggle("off", m === 1);      /* used by both TEAM and PULSE */
  breathLen.disabled = (m === 1);
  syncSwapRow();
  breathLen.setAttribute("aria-label", m === 3
    ? "משך הנשמה, בשניות" : "משך הפסקת ההנשמה, בשניות");
  if(m === 3){
    breathLen.min = "0.5"; breathLen.max = "2"; breathLen.step = "0.5";
    breathLen.value = pulseBreathLen;
  } else if(m === 2){
    breathLen.min = "1.5"; breathLen.max = "4"; breathLen.step = "0.5";
    breathLen.value = teamBreathLen;
  }
  $("breathOut").textContent = breathLen.value + " שנ׳";
  updateSub();
  if(!running){ ventBeat = 0; showIdle(); return; }

  const t = ctx.currentTime;
  if(phase === "pause" || phase === "swapPause") return;   /* pause type fixed; new mode applies after */

  const ev = cancelFuture();
  const slot = ev ? ev.t : nextSlot(t + 0.15);
  upcomingSwap = null;
  if(m === 1){
    breathCapAt = Infinity;                     /* no breathing pauses in compressions-only */
    soloInv = false;                            /* keep filling white from the current beat */
    nextTime = slot;                            /* swapDeadline carries over — swap pauses still apply */
  } else if(m === 3){
    breathCapAt = Infinity;                     /* compression caps don't apply, no compressions */
    swapDeadline = Infinity; swapCapAt = Infinity;
    forced = null; ventBeat = 0;
    nextTime = slot;
  } else {
    repositionTeamCircleLive(t, slot);
  }
  phase = "beats";
  schedulerTick();
  disp = {phase:"idle", end:0, pauseKind:""};
}
/* recompute where the team circle stands (beat, breathCapAt) against the current
   TEAM_CYCLE/RUN_START — used both when switching live into Full CPR and when the
   Rescuers ratio (Solo/Team) changes live while Full CPR is already running */
function repositionTeamCircleLive(t, slot){
  if(dotEls.length !== TEAM_CYCLE) buildRing(TEAM_CYCLE);   /* (re-)entering Full CPR adopts the current ratio */
  dirty = true;                               /* switch-created circle is dirty */
  breathCapAt = lastPauseEnd + BREATH_CAP;    /* breaths owed since last pause */
  /* which beat a team circle would be at, had it run since the last pause */
  const elapsedBeats = Math.floor((slot - lastPauseEnd) / BEAT + 1e-6);
  let b = elapsedBeats + 1;
  if(isPending(t) || b > RUN_START) b = RUN_START;
  beat = Math.max(1, b);
  ranJump = (beat === RUN_START);
  if(beat === RUN_START){
    /* honor the full run: an already-expired breath cap must not shorten it;
       the run's own pause re-arms the cap */
    breathCapAt = Math.max(breathCapAt, slot + (TEAM_CYCLE + 1 - RUN_START) * BEAT + 0.1);
  }
  forced = null;
  nextTime = slot;
}
mode1Btn.addEventListener("click", () => setMode(1));
mode2Btn.addEventListener("click", () => setMode(2));
mode3Btn.addEventListener("click", () => setMode(3));

/* ================= patient (adult/kid) & rescuers (solo/team) ============== */
/* Adult behaves exactly as before in every mode. Kid changes only Full CPR's
   compressions:breath ratio — 30:2 solo (same as adult), 15:2 team — via TEAM_CYCLE/
   RUN_START, which the whole scheduler reads live. Patient can only be changed once CPR
   has been fully reset (Stop) — not merely paused. Rescuers can be changed any time,
   including while counting: the change takes effect immediately, WITHOUT resetting the
   compression count — it only changes how many compressions remain until the next pause.
   If the new (smaller) cycle is already behind the current count, the cycle wraps up on
   the very next beat instead of stretching out to the old, larger one. */
function updateTeamCycle(){
  TEAM_CYCLE = (patient === "kid" && rescuers === "team") ? 15 : 30;
  RUN_START = TEAM_CYCLE - 5;
}
function setPatient(p){
  if(running || paused || p === patient) return;   /* only changeable once fully reset */
  patient = p;
  setOn(patientAdultBtn, patient === "adult"); setOn(patientKidBtn, patient === "kid");
  updateTeamCycle();
  syncRescuerLabels();
  if(mode === 2 && dotEls.length !== TEAM_CYCLE) buildRing(TEAM_CYCLE);
  updateSub();
  showIdle();                                  /* always reached with running === false && paused === false */
}
function syncRescuerLabels(){
  /* adult team stays 30:2 (rescuers only change swapping); kid team is 15:2 */
  rescuersTeamBtn.querySelector("span").textContent = patient === "kid" ? "צוות (15:2)" : "צוות (30:2)";
}
function setRescuers(r){
  if(r === rescuers) return;
  rescuers = r;
  setOn(rescuersSoloBtn, rescuers === "solo"); setOn(rescuersTeamBtn, rescuers === "team");
  if(rescuers === "team") armSwapTimers();
  syncSwapRow();
  updateTeamCycle();
  updateSub();
  if(mode !== 2) return;                        /* nothing else applies outside Full CPR */

  if(phase === "pause"){
    /* respiration (or swap+respiration) is already playing: let it run its full, set
       length — do NOT cut it short. Just make sure the ring reflects the new ratio
       right away; the next cycle, once this pause ends on its own, already reads
       TEAM_CYCLE/RUN_START live, so it automatically starts under the new ratio. */
    if(dotEls.length !== TEAM_CYCLE){
      buildRing(TEAM_CYCLE);
      paintPause();                              /* keep the pause tint after the ring rebuild */
    }
    return;
  }

  if(phase !== "beats") return;                  /* mode 1's swapPause — doesn't apply here (mode === 2) */

  if(dotEls.length !== TEAM_CYCLE) buildRing(TEAM_CYCLE);
  if(beat > TEAM_CYCLE) beat = TEAM_CYCLE;       /* ratio shrank past where we already are — wrap up now */
  upcomingSwap = null; cycleSwapFor = -1;        /* re-decide swap-vs-breath against the new cycle length */

  if(running){
    const t = ctx.currentTime;
    cancelFuture();                              /* drop any beats already scheduled under the old ratio */
    nextTime = nextSlot(t + 0.15);
    schedulerTick();
  } else if(paused){
    numEl.textContent = (beat >= RUN_START + 1) ? (TEAM_CYCLE + 1 - beat) : beat;
    paintDots(beat, null, new Set(Array.from({length: Math.max(0, beat - RUN_START)}, (_, k) => RUN_START + k)));   /* keep the frozen display consistent with the new ratio */
  } else {
    showIdle();
  }
}
patientAdultBtn.addEventListener("click", () => setPatient("adult"));
patientKidBtn.addEventListener("click", () => setPatient("kid"));
rescuersSoloBtn.addEventListener("click", () => setRescuers("solo"));
rescuersTeamBtn.addEventListener("click", () => setRescuers("team"));

/* ================= start / pause / resume / stop ============================ */
/* Three states: idle/reset (only Start shown), running (Pause + Stop shown),
   paused (Resume + Stop shown). Pause freezes everything exactly as it is and can
   be resumed. Stop ends the session, resets Mode/Patient/Rescuers/rate/respiration/
   swap back to defaults — but never touches the elapsed clock; that's its own
   separate "אפס זמן ל־0" action, as before. */
function updateButtons(){
  const idle = !running && !paused;
  startBtn.style.display = idle ? "" : "none";
  pauseBtn.style.display = running ? "" : "none";
  resumeBtn.style.display = paused ? "" : "none";
  stopBtn.style.display = (running || paused) ? "" : "none";
}
function resetSettingsToDefault(){
  /* patient / rescuers back to Adult / Team */
  patient = "adult"; rescuers = "team";
  setOn(patientAdultBtn, true); setOn(patientKidBtn, false);
  setOn(rescuersSoloBtn, false); setOn(rescuersTeamBtn, true);
  syncRescuerLabels();
  updateTeamCycle();

  /* mode back to Full CPR */
  mode = 2;
  setOn(mode1Btn, false); setOn(mode2Btn, true); setOn(mode3Btn, false);
  ringWrap.classList.remove("vent");
  rateRow.classList.remove("off"); rateLen.disabled = false;
  breathRow.classList.remove("off"); breathLen.disabled = false;
  syncSwapRow();
  breathLen.setAttribute("aria-label", "משך הפסקת ההנשמה, בשניות");

  /* sliders back to defaults */
  rateLen.value = "110"; rateOut.textContent = "110 לדקה"; BEAT = 60 / 110;
  teamBreathLen = 2; pulseBreathLen = 1;
  breathLen.min = "1.5"; breathLen.max = "4"; breathLen.step = "0.5"; breathLen.value = "2";
  $("breathOut").textContent = "2 שנ׳";
  swapLen.value = "10"; $("swapOut").textContent = "10 שנ׳";

  if(dotEls.length !== TEAM_CYCLE) buildRing(TEAM_CYCLE);
  updateSub();
}
async function start(){
  if(running || starting) return;
  starting = true; startBtn.disabled = true;
  try{
    if(!ctx){
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      voiceGain = ctx.createGain();
      voiceGain.gain.value = VOICE_GAIN;
      voiceGain.connect(ctx.destination);
    }
    if(ctx.state === "suspended") await ctx.resume();
    if(!buffersReady) await decodeAll();
    silenceAll();
    running = true; paused = false;

    sessionEpoch = Date.now(); frozenMs = 0;  /* fresh session */
    phase = "beats"; resetCycle(); soloInv = false; ventBeat = 0; ventInv = false;
    if(dotEls.length !== ringCycleFor(mode)) buildRing(ringCycleFor(mode));
    const base = ctx.currentTime + 0.2;
    nextTime = base;
    lastPauseEnd = base;
    swapDeadline = base + SWAP_EVERY;
    swapCapAt = base + SWAP_CAP;
    breathCapAt = (mode === 2) ? base + BREATH_CAP : Infinity;

    disp = {phase:"idle", end:0, pauseKind:""};
    timerId = setInterval(schedulerTick, TICK_MS);
    schedulerTick();
    clockEl.classList.remove("frozen");
    requestWake();
    updateButtons();
  }catch(e){
    running = false;
  }finally{
    starting = false; startBtn.disabled = false;
  }
}
function pause(){
  if(!running) return;
  running = false; paused = true;
  clearInterval(timerId); timerId = null;
  silenceAll();
  frozenMs = Date.now() - sessionEpoch;         /* keep beat/phase/deadlines exactly as they are, for Resume */
  clockEl.classList.add("frozen");
  releaseWake();
  updateButtons();
}
async function resume(){
  if(running || !paused || starting) return;
  starting = true;
  try{
    if(ctx.state === "suspended") await ctx.resume();
    silenceAll();
    running = true; paused = false;
    const t = ctx.currentTime;
    if(phase === "pause" || phase === "swapPause"){
      if(phaseEnd > t + 0.05){
        const beeping = phase === "swapPause" || pauseKind === "swr";
        nextTime = beeping ? t + 0.05 : phaseEnd;   /* swap tone keeps beeping; breath pauses just wait out */
        visualQ.push({t, kind:"pause", pauseKind, end:phaseEnd, inv:ventInv, tot:ventLen});
      } else {
        phase = "beats"; resetCycle(); ventBeat = 0;
        if(dotEls.length !== ringCycleFor(mode)) buildRing(ringCycleFor(mode));
        nextTime = nextSlot(t + 0.2);
      }
    } else {
      if(isPending(t) && mode === 2){ beat = RUN_START; ranJump = true; dirty = true; upcomingSwap = null; }
      nextTime = nextSlot(t + 0.2);              /* otherwise: pick up exactly where it left off */
    }
    disp = {phase:"idle", end:0, pauseKind:""};
    timerId = setInterval(schedulerTick, TICK_MS);
    schedulerTick();
    clockEl.classList.remove("frozen");
    requestWake();
    updateButtons();
  }catch(e){
    running = false; paused = true;
  }finally{
    starting = false;
  }
}
function stopCpr(){
  if(!running && !paused) return;
  if(running){
    clearInterval(timerId); timerId = null;
    frozenMs = Date.now() - sessionEpoch;
    releaseWake();
  }
  silenceAll();
  running = false; paused = false;
  clockEl.classList.add("frozen");
  phase = "beats"; resetCycle(); soloInv = false; ventBeat = 0; ventInv = false;
  resetSettingsToDefault();
  disp = {phase:"idle", end:0, pauseKind:""};
  showIdle();
  updateButtons();
}
startBtn.addEventListener("click", start);
pauseBtn.addEventListener("click", pause);
resumeBtn.addEventListener("click", resume);
stopBtn.addEventListener("click", stopCpr);
updateButtons();

/* ================= visuals ================================================= */
const warnSet = new Set();   /* dot indices painted during the current countdown (stay amber; earlier dots stay white) */
function paintDots(n, cls, warn){
  for(let i = 0; i < dotEls.length; i++){
    const d = dotEls[i];
    if(cls){ d.setAttribute("class", "dot " + cls); continue; }
    let k = "dot";
    if(i < n){ k += " f"; if(warn && warn.has(i)) k += " last"; }
    d.setAttribute("class", k);
  }
}
function paintDotsSolo(n, inv, warn){ /* inv=false: 1..n white; inv=true: 1..n gray; warn=true tints filled dots amber */
  for(let i = 0; i < dotEls.length; i++){
    const filled = inv ? (i >= n) : (i < n);
    let k = filled ? "dot f" : "dot";
    if(filled && warn && warn.has(i)) k += " last";
    dotEls[i].setAttribute("class", k);
  }
}
function paintVentDots(n, inv){ /* mirrors paintDotsSolo: inv=false fills gray→white, inv=true drains white→gray */
  for(let i = 0; i < ventDotEls.length; i++){
    const filled = inv ? (i >= n) : (i < n);
    ventDotEls[i].setAttribute("class", filled ? "dot f" : "dot");
  }
}
function paintPause(){
  const swap = disp.pauseKind === "swr" || disp.pauseKind === "swap";
  const col = swap ? "cyan" : "green";
  numEl.className = col; labEl.className = col;
  labEl.textContent = disp.pauseKind === "swr" ? "החלפה + הנשמה"
    : disp.pauseKind === "swap" ? "החלפה"
    : disp.pauseKind === "vent" ? "תן הנשמה"
    : "הנשמה";
  if(disp.pauseKind === "vent"){ if(disp.tot && ventDotEls.length !== disp.tot) buildVentRing(disp.tot); paintVentDots(ventDotEls.length, disp.inv); }
  else paintDots(0, swap ? "c" : "g");
}
function showIdle(){
  numEl.className = ""; labEl.className = ""; labEl.textContent = "";
  numEl.textContent = "1";
  warnSet.clear();
  paintDots(0);
  if(ventDotEls.length !== ventCountNow()) buildVentRing(ventCountNow());
  paintVentDots(0, false);
}
function applyEvent(e){
  if(e.kind === "beat"){
    disp = {phase:"beat", end:0, pauseKind:""};
    numEl.className = e.warn ? "amber" : "";
    if(e.warn) warnSet.add(e.beat - 1); else warnSet.clear();
    if(e.m === 1){
      numEl.textContent = e.cnt != null ? e.cnt : e.beat;
      labEl.className = e.warn ? "amber" : "";
      labEl.textContent = e.warn ? "החלפה בעוד" : "";
      paintDotsSolo(e.beat, e.inv, e.warn ? warnSet : null);
    } else {
      numEl.textContent = e.cnt;         /* mirrors the voice: countup or countdown */
      if(e.lab === "swr"){ labEl.className = "cyan"; labEl.textContent = "החלפה + הנשמה בעוד"; }
      else if(e.lab === "b"){ labEl.className = "green"; labEl.textContent = "הנשמה בעוד"; }
      else { labEl.className = ""; labEl.textContent = ""; }
      paintDots(e.beat, null, e.warn ? warnSet : null);   /* ring keeps the true circle position */
    }
  } else if(e.kind === "ventWait"){
    disp = {phase:"vwait", end:0, pauseKind:""};
    numEl.className = "amber"; labEl.className = "amber";
    labEl.textContent = "ההנשמה הבאה";
    if(ventDotEls.length !== e.tot) buildVentRing(e.tot);
    numEl.textContent = e.tot - e.n + 1;
    paintVentDots(e.n, e.inv);
  } else {
    disp = {phase:"pause", end:e.end, pauseKind:e.pauseKind, inv:e.inv, tot:e.tot};
    paintPause();
  }
}
function fmtClock(ms){
  const s = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(s / 60), r = s % 60, h = Math.floor(m / 60);
  const rr = String(r).padStart(2, "0");
  return h ? h + ":" + String(m % 60).padStart(2, "0") + ":" + rr : (m + ":" + rr);
}
function setText(el, txt){ if(el.textContent !== String(txt)) el.textContent = txt; }
function frame(){
  if(running && ctx){
    const now = ctx.currentTime;
    let latest = null;
    while(visualQ.length && visualQ[0].t <= now) latest = visualQ.shift();
    if(latest) applyEvent(latest);
    if(disp.phase === "pause"){
      setText(numEl, Math.max(1, Math.ceil(disp.end - now)));
    }
    setText(clockEl, fmtClock(Date.now() - sessionEpoch));
    setText(resetBtn, "אפס ספירה ל־1");
    resetBtn.classList.remove("hide");
    resetBtn.disabled = (mode === 1) || (mode === 3) || phase === "pause" || lockedAt(now);
    patientRow.classList.add("locked");        /* age group can't change mid-CPR; rescuers (like mode) still can */
  } else {
    patientRow.classList.toggle("locked", paused);   /* only changeable once fully reset (Stop), not merely paused */
    setText(clockEl, fmtClock(frozenMs));
    if(paused){
      resetBtn.classList.add("hide");           /* nothing to reset mid-pause — Resume or Stop instead */
    } else if(frozenMs > 0){
      setText(resetBtn, "אפס זמן ל־0");
      resetBtn.classList.remove("hide");
      resetBtn.disabled = false;
    } else {
      resetBtn.classList.add("hide");
      clockEl.classList.remove("frozen");
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= wake lock =============================================== */
async function requestWake(){
  try{
    if("wakeLock" in navigator){
      wakeLock = await navigator.wakeLock.request("screen");
    }
  }catch(e){}
}
function releaseWake(){
  try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if(running && document.visibilityState === "visible") requestWake();
});

/* ================= remaining ui wiring ===================================== */
breathLen.addEventListener("input", () => {
  $("breathOut").textContent = breathLen.value + " שנ׳";
  if(mode === 3){
    updateSub();
    if(!running) showIdle();
  }
});
swapLen.addEventListener("input", () => { $("swapOut").textContent = swapLen.value + " שנ׳"; });
rateLen.addEventListener("input", () => {
  BEAT = 60 / (+rateLen.value);
  rateOut.textContent = rateLen.value + " לדקה";
  updateSub();
});
function toggle(){ if(running) pause(); else if(paused) resume(); else start(); }
document.addEventListener("keydown", e => {
  if(e.code !== "Space") return;
  if(e.target.closest("button, input, summary, select, textarea")) return;
  e.preventDefault(); toggle();
});
showIdle();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
  const hadController = !!navigator.serviceWorker.controller;   /* first install: nothing to refresh */
  let refreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || running || paused || refreshing) return;   /* never reload mid-session; new version loads next visit */
    refreshing = true;
    location.reload();
  });
}
</script>
