<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050607">
<title>CPR Metronome</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#050607; --fg:#f5f6f7; --dim:#9aa0a6; --panel:#101215; --line:#23262b;
    --dot-empty:#26282c; --dot-fill:#ffffff; --amber:#ff9f2e;
    --green:#22c55e; --cyan:#38bdf8; --red:#d81f2f; --red-press:#a8121f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
    display:flex; flex-direction:column; align-items:center;
    padding:8px 12px 6px; gap:8px; overflow-x:hidden;
  }
  :focus-visible{outline:2px solid #7dd3fc; outline-offset:2px;}
  header{text-align:center; line-height:1.15;}
  header h1{margin:0; font-size:19px; font-weight:700; letter-spacing:.04em;}
  #sub{color:var(--dim); font-size:13px; margin-top:2px;}
  #clock{
    font-size:26px; font-weight:800; margin-top:2px;
    font-variant-numeric:tabular-nums; letter-spacing:.02em;
  }
  #clock.frozen{color:var(--amber);}

  /* ring */
  #ringWrap{position:relative; width:min(84vw,300px); aspect-ratio:1;}
  #ringWrap svg{width:100%; height:100%; display:block;}
  #ringWrap.solo svg{visibility:hidden;}
  .dot{fill:var(--dot-empty); transition:fill .08s linear;}
  .dot.f{fill:var(--dot-fill);}
  .dot.f.last{fill:var(--amber);}
  .dot.g{fill:var(--green);}
  .dot.c{fill:var(--cyan);}
  #center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; pointer-events:none;
  }
  #num{
    font-size:82px; font-weight:800; line-height:1;
    font-variant-numeric:tabular-nums; letter-spacing:-.02em;
  }
  #num.green{color:var(--green);} #num.cyan{color:var(--cyan);}
  #stateLab{
    margin-top:4px; font-size:14px; font-weight:700; letter-spacing:.18em;
    min-height:18px; text-align:center;
  }
  #stateLab.green{color:var(--green); letter-spacing:.08em; font-size:12px;} #stateLab.cyan{color:var(--cyan); letter-spacing:.08em; font-size:12px;}

  /* buttons */
  #btns{width:100%; max-width:420px; display:flex; flex-direction:column; gap:8px;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:14px;}
  #startBtn{
    height:64px; font-size:24px; font-weight:800; letter-spacing:.12em;
    color:#fff; background:var(--red);
  }
  #startBtn:active{background:var(--red-press);}
  #startBtn.running{background:#8f1622;}
  #startBtn.resume{background:#1d7f3f;}
  #resetBtn{
    height:58px; font-size:16px; font-weight:700; letter-spacing:.06em;
    color:var(--fg); background:var(--panel); border:1px solid var(--line);
  }
  #resetBtn:active{background:#1b1e23;}
  #resetBtn:disabled{opacity:.35; pointer-events:none;}
  #resetBtn.hide{visibility:hidden;}

  /* settings panel */
  #panel{
    width:100%; max-width:420px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:8px 12px;
    display:flex; flex-direction:column; gap:4px;
  }
  .row{display:flex; align-items:center; gap:10px; min-height:42px;}
  .row .lab{font-size:14px; flex:0 0 auto;}
  .row output{font-size:13px; color:var(--dim); min-width:34px; text-align:right;
    font-variant-numeric:tabular-nums;}
  .row.off{opacity:.35;}
  .seg{display:flex; margin-left:auto; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .seg button{
    border-radius:0; background:transparent; color:var(--dim);
    padding:0 16px; height:46px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px;
  }
  .seg button span{font-size:10px; font-weight:700; letter-spacing:.1em;}
  .seg button.on{background:#2a2e35; color:var(--fg);}
  input[type=range]{
    flex:1; min-width:60px; height:32px; accent-color:var(--cyan); margin:0;
  }
  input[type=range]:disabled{opacity:.35;}

  footer{
    color:#6a7076; font-size:11px; text-align:center; line-height:1.35;
    max-width:420px; margin-top:auto;
  }

  /* short screens */
  @media (max-height:800px){
    body{gap:5px; padding-top:5px;}
    header h1{font-size:16px;} #sub{font-size:12px;} #clock{font-size:22px;}
    #ringWrap{width:min(66vw,225px);}
    #num{font-size:60px;} #stateLab{font-size:12px; min-height:14px;}
    #startBtn{height:52px; font-size:20px;}
    #resetBtn{height:46px; font-size:14px;}
    .row{min-height:36px;}
    footer{display:none;}
  }
</style>
</head>
<body>
<header>
  <h1>CPR METRONOME</h1>
  <div id="sub">120 BPM · 30:2</div>
  <div id="clock">0:00</div>
</header>

<div id="ringWrap">
  <svg viewBox="0 0 200 200" aria-hidden="true"><g id="dots"></g></svg>
  <div id="center">
    <div id="num">1</div>
    <div id="stateLab"></div>
  </div>
</div>

<div id="btns">
  <button id="startBtn">START</button>
  <button id="resetBtn" class="hide">RESET COUNT TO 1</button>
</div>

<div id="panel">
  <div class="row">
    <span class="lab">Rescuers</span>
    <div class="seg" role="group" aria-label="Number of rescuers">
      <button id="mode1" aria-pressed="false" aria-label="One rescuer"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="7.5" r="4"/><path d="M12 13.5c-4.6 0-8 2.6-8 6V21h16v-1.5c0-3.4-3.4-6-8-6z"/></svg><span>SOLO</span></button>
      <button id="mode2" class="on" aria-pressed="true" aria-label="Two rescuers"><svg width="26" height="16" viewBox="0 0 40 24" fill="currentColor" aria-hidden="true"><circle cx="10" cy="7.5" r="4"/><path d="M10 13.5c-4.3 0-7.5 2.4-7.5 5.7V21h15v-1.8c0-3.3-3.2-5.7-7.5-5.7z"/><circle cx="30" cy="7.5" r="4"/><path d="M30 13.5c-4.3 0-7.5 2.4-7.5 5.7V21h15v-1.8c0-3.3-3.2-5.7-7.5-5.7z"/></svg><span>TEAM</span></button>
    </div>
  </div>
  <div class="row" id="breathRow">
    <span class="lab">Respiration</span>
    <input type="range" id="breathLen" min="2" max="5" step="1" value="3" aria-label="Respiration pause length, seconds">
    <output id="breathOut">3 s</output>
  </div>
  <div class="row">
    <span class="lab">Pulse check<br><small style="color:var(--dim)">every 2 min</small></span>
    <input type="range" id="pulseLen" min="5" max="15" step="1" value="10" aria-label="Pulse check length, seconds">
    <output id="pulseOut">10 s</output>
  </div>
</div>

<footer>Training aid only — not a substitute for CPR training or emergency dispatch
instructions. Call emergency services first.</footer>

/* ================= constants =============================================== */
const BEAT = 0.5;                 // 120 BPM
const CYCLE = 30;
const AHEAD = 0.12;               // schedule-ahead window (s)
const TICK_MS = 25;               // scheduler interval
const PULSE_EVERY = 120;          // s: pulse deadline after last pulse-pause end
const PULSE_CAP = 180;            // s: hard cap — forced pulse pause
const BREATH_CAP = 30;            // s: hard cap — forced breathing pause (team)
const RUN_START = 25;             // dirty-while-pending: next beat jumps here
const GRACE_MS = 10000;           // resume window after stop
const VOICE_GAIN = 0.8;

const COUNT_WORDS = {26:"six", 27:"seven", 28:"eight", 29:"nine", 30:"thirty"};
const NUM_WORDS = {5:"five", 4:"four", 3:"three", 2:"two", 1:"one"};

/* ================= state =================================================== */
let ctx = null, voiceGain = null;
const buffers = {};
let buffersReady = false;

let running = false, starting = false;
let mode = 2;                     // rescuers
let phase = "beats";              // beats | pause
let pauseKind = "";               // breath | pulse | spb
let beat = 1;                     // team count (next beat to schedule)
let nextTime = 0;                 // audio-clock time of next event to schedule
let phaseEnd = 0;

let dirty = false;                // team circle touched by reset / mode switch
let ranJump = false;              // 25-run already triggered for this pending episode
let forced = null;                // null | "breath" | "pulse" — hard-cap jump active
let upcomingSPB = null;           // latched at beat 26: is the coming pause S·P·B?

let pulseDeadline = Infinity;     // ctx time
let pulseCapAt = Infinity;
let breathCapAt = Infinity;
let lastPauseEnd = 0;             // end of last pause (any kind, any mode)

let timerId = null;
let scheduled = [];               // {node,t}
let visualQ = [];
let disp = {phase:"idle", end:0, pauseKind:""};
let wakeLock = null;

/* session timer / grace */
let sessionEpoch = 0;             // Date.now at session start (survives resume)
let frozenMs = 0;                 // elapsed shown while stopped
let graceUntil = 0;               // Date.now deadline for resume, 0 = none
let graceTimer = null;

/* ================= dom ===================================================== */
const $ = id => document.getElementById(id);
const numEl = $("num"), labEl = $("stateLab"), subEl = $("sub"), clockEl = $("clock");
const startBtn = $("startBtn"), resetBtn = $("resetBtn");
const mode1Btn = $("mode1"), mode2Btn = $("mode2");
const breathRow = $("breathRow"), breathLen = $("breathLen");
const pulseLen = $("pulseLen");
const ringWrap = $("ringWrap");

/* build ring: dot 1 at 12 o'clock, clockwise */
const dotEls = [];
(function(){
  const g = $("dots");
  for(let i = 0; i < CYCLE; i++){
    const a = (-90 + i * 12) * Math.PI / 180;
    const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx", (100 + 90 * Math.cos(a)).toFixed(2));
    c.setAttribute("cy", (100 + 90 * Math.sin(a)).toFixed(2));
    c.setAttribute("r", "5.2");
    c.setAttribute("class", "dot");
    g.appendChild(c); dotEls.push(c);
  }
})();

/* ================= audio helpers =========================================== */
function b64ToBuf(b64){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}
async function decodeAll(){
  for(const n of Object.keys(VOICE_DATA)){
    buffers[n] = await new Promise((res, rej) =>
      ctx.decodeAudioData(b64ToBuf(VOICE_DATA[n]), res, rej));
  }
  buffersReady = true;
}
function track(node, t){ scheduled.push({node, t}); }

function tickSnd(t){ /* high tick */
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "square"; o.frequency.value = 1650;
  g.gain.setValueAtTime(0.55, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
  o.connect(g).connect(ctx.destination);
  o.start(t); o.stop(t + 0.05); track(o, t);
}
function lowClick(t){ /* quiet click under voice counts */
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine"; o.frequency.value = 440;
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  o.connect(g).connect(ctx.destination);
  o.start(t); o.stop(t + 0.05); track(o, t);
}
function playVoice(name, t){
  const b = buffers[name]; if(!b) return;
  const s = ctx.createBufferSource();
  s.buffer = b; s.connect(voiceGain);
  s.start(t); track(s, t);
}
function voicedBeat(word, t){ playVoice(word, t); lowClick(t); }

/* ================= timing helpers ========================================== */
function isPending(t){ return t >= pulseDeadline - 1e-6; }
function lockedAt(t){ return beat >= 26 && (isPending(t) || forced !== null); }
function nextSlot(from){ /* next grid slot >= from; nextTime is always on-grid */
  const k = Math.ceil((from - nextTime) / BEAT);
  return nextTime + Math.max(k, 0) * BEAT;
}
function armAfterPause(isPulse, end){
  lastPauseEnd = end;
  breathCapAt = end + BREATH_CAP;
  if(isPulse){ pulseDeadline = end + PULSE_EVERY; pulseCapAt = end + PULSE_CAP; }
}

/* ================= pauses ================================================== */
function enterBreath(t){
  const len = +breathLen.value;
  phase = "pause"; pauseKind = "breath";
  phaseEnd = t + len; nextTime = phaseEnd;
  beat = 1; dirty = false; ranJump = false; forced = null; upcomingSPB = null;
  armAfterPause(false, phaseEnd);
  playVoice("resp", t);
  visualQ.push({t, kind:"pause", pauseKind:"breath", end:phaseEnd});
}
function enterPulsePause(t, m){
  const len = +pulseLen.value;
  phase = "pause"; pauseKind = (m === 2) ? "spb" : "pulse";
  phaseEnd = t + len; nextTime = phaseEnd;
  beat = 1; dirty = false; ranJump = false; forced = null; upcomingSPB = null;
  armAfterPause(true, phaseEnd);
  playVoice(m === 2 ? "spb" : "pulse", t);
  visualQ.push({t, kind:"pause", pauseKind, end:phaseEnd});
}

/* ================= scheduler =============================================== */
function schedulerTick(){
  const horizon = ctx.currentTime + AHEAD;
  let guard = 0;
  while(nextTime < horizon && guard++ < 80){
    if(phase === "pause"){
      phase = "beats"; beat = 1; dirty = false; ranJump = false;
      forced = null; upcomingSPB = null;
      continue;                            /* beats resume at nextTime = phaseEnd */
    }
    const t = nextTime;
    if(mode === 1){
      /* ---- solo: continuous, countdown to deadline ---- */
      const remain = Math.round((pulseDeadline - t) / BEAT);
      if(remain <= 0){ enterPulsePause(t, 1); continue; }
      if(remain <= 5) voicedBeat(NUM_WORDS[remain], t);
      else tickSnd(t);
      visualQ.push({t, kind:"beat", m:1, remain});
      nextTime += BEAT;
    } else {
      /* ---- team ---- */
      if(beat <= 25){
        if(t >= pulseCapAt - 2.6){ beat = 26; forced = "pulse"; }
        else if(t >= breathCapAt - 2.6){ beat = 26; forced = "breath"; }
        else if(isPending(t) && dirty && !ranJump){ beat = RUN_START; ranJump = true; }
      }
      let cnt = beat, lab = "";
      if(beat >= 26){
        if(upcomingSPB === null){          /* latch the coming pause type once */
          const end = t + (CYCLE + 1 - beat) * BEAT;
          /* look one cycle ahead: if the deadline falls before the end of the
             FOLLOWING cycle, take the pulse check now rather than late */
          upcomingSPB = forced === "pulse" || isPending(end) ||
                        pulseDeadline <= end + (+breathLen.value) + CYCLE * BEAT;
        }
        if(upcomingSPB){                   /* countdown announces S·P·B */
          cnt = CYCLE + 1 - beat; lab = "spb";
          voicedBeat(NUM_WORDS[cnt], t);
        } else {                           /* countup announces breaths */
          lab = "b";
          voicedBeat(COUNT_WORDS[beat], t);
        }
      } else tickSnd(t);
      visualQ.push({t, kind:"beat", m:2, beat, cnt, lab});
      nextTime += BEAT; beat++;
      if(beat > CYCLE){
        beat = 1;
        const end = nextTime;
        if(upcomingSPB) enterPulsePause(end, 2);
        else enterBreath(end);
      }
    }
  }
  if(scheduled.length > 300){
    const cut = ctx.currentTime - 4;
    scheduled = scheduled.filter(s => s.t > cut);
  }
}

function cancelFuture(){
  const now = ctx.currentTime;
  for(const s of scheduled){
    if(s.t > now - 2.5){ try{ s.node.stop(0); }catch(e){} }
  }
  scheduled = scheduled.filter(s => s.t <= now);
  const fut = visualQ.filter(e => e.t > now + 0.015);
  visualQ = visualQ.filter(e => e.t <= now + 0.015);
  fut.sort((a, b) => a.t - b.t);
  return fut[0] || null;
}

/* ================= reset button (dual role) ================================ */
function resetCount(){
  if(!running || mode === 1 || phase === "pause") return;
  const t = ctx.currentTime;
  if(lockedAt(t)) return;                       /* final-5 with pulse/cap: untouchable */
  const ev = cancelFuture();
  dirty = true; upcomingSPB = null;
  if(isPending(t)){ beat = RUN_START; ranJump = true; }
  else beat = 1;
  nextTime = ev ? ev.t : nextSlot(t + 0.15);
  schedulerTick();
  disp = {phase:"idle", end:0, pauseKind:""};
}
function resetTime(){
  frozenMs = 0;
  cancelGrace(true);                            /* declared a new case */
}
resetBtn.addEventListener("click", () => { running ? resetCount() : resetTime(); });

/* ================= mode switch ============================================= */
function setMode(m){
  if(m === mode) return;
  mode = m;
  mode1Btn.classList.toggle("on", m === 1);
  mode2Btn.classList.toggle("on", m === 2);
  mode1Btn.setAttribute("aria-pressed", m === 1);
  mode2Btn.setAttribute("aria-pressed", m === 2);
  subEl.textContent = m === 2 ? "120 BPM · 30:2" : "120 BPM · continuous";
  breathRow.classList.toggle("off", m === 1);
  breathLen.disabled = (m === 1);
  ringWrap.classList.toggle("solo", m === 1);
  if(!running){ showIdle(); return; }

  const t = ctx.currentTime;
  if(phase === "pause") return;                 /* pause type fixed; new mode applies after */

  const ev = cancelFuture();
  const slot = ev ? ev.t : nextSlot(t + 0.15);
  upcomingSPB = null;
  if(m === 1){
    breathCapAt = Infinity;                     /* no breath pauses in solo */
    nextTime = slot;                            /* pending -> scheduler pulses at once */
  } else {
    dirty = true;                               /* switch-created circle is dirty */
    breathCapAt = lastPauseEnd + BREATH_CAP;    /* breaths owed since last pause */
    /* which beat a team circle would be at, had it run since the last pause */
    const elapsedBeats = Math.floor((slot - lastPauseEnd) / BEAT + 1e-6);
    let b = elapsedBeats + 1;
    if(isPending(t) || b > RUN_START) b = RUN_START;
    beat = Math.max(1, b);
    ranJump = (beat === RUN_START);
    if(beat === RUN_START){
      /* honor the full 25-run: an already-expired breath cap must not
         shorten it to a 26-run; the run's own pause re-arms the cap */
      breathCapAt = Math.max(breathCapAt, slot + (CYCLE + 1 - RUN_START) * BEAT + 0.1);
    }
    forced = null;
    nextTime = slot;
  }
  schedulerTick();
  disp = {phase:"idle", end:0, pauseKind:""};
}
mode1Btn.addEventListener("click", () => setMode(1));
mode2Btn.addEventListener("click", () => setMode(2));

/* ================= start / stop / resume / grace =========================== */
function cancelGrace(toStart){
  if(graceTimer){ clearTimeout(graceTimer); graceTimer = null; }
  graceUntil = 0;
  phase = "beats"; beat = 1; dirty = false; ranJump = false; forced = null; upcomingSPB = null;
  if(toStart !== false){ startBtn.textContent = "START"; startBtn.classList.remove("resume"); }
  showIdle();
}
async function start(){
  if(running || starting) return;
  starting = true; startBtn.disabled = true;
  const resuming = graceUntil > 0 && Date.now() < graceUntil;
  try{
    if(!ctx){
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      voiceGain = ctx.createGain();
      voiceGain.gain.value = VOICE_GAIN;
      voiceGain.connect(ctx.destination);
    }
    if(ctx.state === "suspended") await ctx.resume();
    if(!buffersReady) await decodeAll();
    scheduled = []; visualQ = [];
    running = true;

    if(resuming){
      if(graceTimer){ clearTimeout(graceTimer); graceTimer = null; }
      graceUntil = 0;
      const t = ctx.currentTime;
      if(phase === "pause"){
        if(phaseEnd > t + 0.05){
          nextTime = phaseEnd;                  /* finish the pause's remaining wall time */
          visualQ.push({t, kind:"pause", pauseKind, end:phaseEnd});
        } else {
          phase = "beats"; beat = 1; dirty = false; ranJump = false; forced = null; upcomingSPB = null;
          nextTime = nextSlot(t + 0.2);
        }
      } else {
        if(isPending(t) && mode === 2){ beat = RUN_START; ranJump = true; dirty = true; upcomingSPB = null; }
        nextTime = nextSlot(t + 0.2);           /* solo pending: scheduler pulses at once */
      }
    } else {
      sessionEpoch = Date.now(); frozenMs = 0;  /* new patient, everything anew */
      phase = "beats"; beat = 1; dirty = false; ranJump = false; forced = null; upcomingSPB = null;
      const base = ctx.currentTime + 0.2;
      nextTime = base;
      lastPauseEnd = base;
      pulseDeadline = base + PULSE_EVERY;
      pulseCapAt = base + PULSE_CAP;
      breathCapAt = (mode === 2) ? base + BREATH_CAP : Infinity;
    }
    disp = {phase:"idle", end:0, pauseKind:""};
    timerId = setInterval(schedulerTick, TICK_MS);
    schedulerTick();
    startBtn.textContent = "STOP";
    startBtn.classList.add("running"); startBtn.classList.remove("resume");
    clockEl.classList.remove("frozen");
    requestWake();
  }catch(e){
    running = false;
  }finally{
    starting = false; startBtn.disabled = false;
  }
}
function stop(){
  if(!running) return;
  running = false;
  clearInterval(timerId); timerId = null;
  for(const s of scheduled){ try{ s.node.stop(0); }catch(e){} }
  scheduled = []; visualQ = [];
  /* keep beat/phase/deadlines for a grace resume; clocks keep ticking */
  frozenMs = Date.now() - sessionEpoch;
  graceUntil = Date.now() + GRACE_MS;
  graceTimer = setTimeout(() => { cancelGrace(); }, GRACE_MS);
  startBtn.textContent = "RESUME";
  startBtn.classList.remove("running"); startBtn.classList.add("resume");
  clockEl.classList.add("frozen");
  releaseWake();
}
function toggle(){ running ? stop() : start(); }
startBtn.addEventListener("click", toggle);

/* ================= visuals ================================================= */
function paintDots(n, cls){
  for(let i = 0; i < CYCLE; i++){
    const d = dotEls[i];
    if(cls){ d.setAttribute("class", "dot " + cls); continue; }
    let k = "dot";
    if(i < n){ k += " f"; if(i >= 25) k += " last"; }
    d.setAttribute("class", k);
  }
}
function paintPause(){
  const pulse = disp.pauseKind !== "breath";
  const col = pulse ? "cyan" : "green";
  numEl.className = col; labEl.className = col;
  labEl.textContent = disp.pauseKind === "spb" ? "SWAP · CHECK PULSE · RESPIRATION"
                    : disp.pauseKind === "pulse" ? "CHECK PULSE" : "RESPIRATION";
  paintDots(0, pulse ? "c" : "g");
}
function showIdle(){
  numEl.className = ""; labEl.className = ""; labEl.textContent = "";
  numEl.textContent = (mode === 1) ? String(PULSE_EVERY / BEAT) : "1";
  paintDots(0);
}
function applyEvent(e){
  if(e.kind === "beat"){
    disp = {phase:"beat", end:0, pauseKind:""};
    numEl.className = "";
    if(e.m === 1){
      numEl.textContent = e.remain;
      labEl.className = (e.remain <= 5) ? "cyan" : "";
      labEl.textContent = (e.remain <= 5) ? "PULSE CHECK COMING" : "";
    } else {
      numEl.textContent = e.cnt;         /* mirrors the voice: countup or countdown */
      if(e.lab === "spb"){ labEl.className = "cyan"; labEl.textContent = "SWAP + PULSE CHECK + RESPIRATION COMING"; }
      else if(e.lab === "b"){ labEl.className = "green"; labEl.textContent = "RESPIRATION COMING"; }
      else { labEl.className = ""; labEl.textContent = ""; }
      paintDots(e.beat);                 /* ring keeps the true circle position */
    }
  } else {
    disp = {phase:"pause", end:e.end, pauseKind:e.pauseKind};
    paintPause();
  }
}
function fmtClock(ms){
  const s = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(s / 60), r = s % 60, h = Math.floor(m / 60);
  const rr = String(r).padStart(2, "0");
  return h ? h + ":" + String(m % 60).padStart(2, "0") + ":" + rr : (m + ":" + rr);
}
function frame(){
  if(running && ctx){
    const now = ctx.currentTime;
    let latest = null;
    while(visualQ.length && visualQ[0].t <= now) latest = visualQ.shift();
    if(latest) applyEvent(latest);
    if(disp.phase === "pause"){
      numEl.textContent = Math.max(1, Math.ceil(disp.end - now));
    }
    clockEl.textContent = fmtClock(Date.now() - sessionEpoch);
    resetBtn.textContent = "RESET COUNT TO 1";
    resetBtn.classList.remove("hide");
    resetBtn.disabled = (mode === 1) || phase === "pause" || lockedAt(now);
  } else {
    clockEl.textContent = fmtClock(frozenMs);
    if(frozenMs > 0){
      resetBtn.textContent = "RESET TIME TO 0";
      resetBtn.classList.remove("hide");
      resetBtn.disabled = false;
    } else {
      resetBtn.classList.add("hide");
      clockEl.classList.remove("frozen");
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= wake lock =============================================== */
async function requestWake(){
  try{
    if("wakeLock" in navigator){
      wakeLock = await navigator.wakeLock.request("screen");
    }
  }catch(e){}
}
function releaseWake(){
  try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if(running && document.visibilityState === "visible") requestWake();
});

/* ================= remaining ui wiring ===================================== */
breathLen.addEventListener("input", () => { $("breathOut").textContent = breathLen.value + " s"; });
pulseLen.addEventListener("input", () => { $("pulseOut").textContent = pulseLen.value + " s"; });
document.addEventListener("keydown", e => {
  if(e.code !== "Space") return;
  if(e.target.closest("button, input, summary, select, textarea")) return;
  e.preventDefault(); toggle();
});
showIdle();
</script>

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
}
